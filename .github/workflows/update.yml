name: Update monetary policy dashboard

on:
  push:
    paths:
      - 'cme_derived/**'
  schedule:
    # 13:43 UTC weekdays (9:43am EDT / 8:43am EST). The CME-derived push
    # triggers its own rebuild whenever it lands (see push: above); this run
    # catches USMPD updates (roughly 8x/year, around FOMC meetings) and daily
    # FRED series on days with no CME update. Off the top of the hour, when
    # GitHub delays or drops scheduled runs.
    - cron: '43 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: scripts
        run: |
          python3 00_fetch_usmpd.py
          python3 00_fetch_fred_corporate.py
          python3 05_fetch_fred_dff.py
          python3 01_load_full_sample.py --force
          python3 02_production_estimates.py
          python3 03_build_dashboard_data.py
          python3 04_build_dashboard.py

      - name: Commit updated dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update dashboard $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase --autostash origin main
          done
          git push  # fails the step if every retry was rejected
